name: Main

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Publish adds id-token for OIDC registry auth.
permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: List matrix cells
        id: list
        run: echo "list={\"include\":$(bin/matrix-cells)}" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run check
      - name: Run build
        run: npm run build:types

  validate:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.list) }}
    name: ${{ matrix.name }} (Node ${{ matrix.node }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: bin/run-cell "${{ matrix.package }}" "${{ matrix.major }}" "${{ matrix.test }}"

  publish:
    needs: [check, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Bind OIDC to this environment. Create "release" in each repo Settings → Environments
    # and set the same name on the registry trusted publisher.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package version $expected"
            exit 1
          fi
      - name: Verify changelog has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a section: ## [${version}] - YYYY-MM-DD"
            exit 1
          fi
      - name: Publish package
        run: npm publish --access public
